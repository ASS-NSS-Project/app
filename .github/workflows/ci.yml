name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, kost]
    tags: ["v*.*.*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Check if specific paths changed (used for conditional job execution)
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      tests: ${{ steps.filter.outputs.tests }}
      examples: ${{ steps.filter.outputs.examples }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            tests:
              - 'tests/**'
              - 'backend/**'
            examples:
              - 'example/**/*.sh'
              - '.github/workflows/ci.yml'

  conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pre-commit conventional-pre-commit
      - name: Check commit message
        run: |
          MSG_FILE=$(mktemp)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git log -1 --format=%B ${{ github.event.pull_request.head.sha }} > "$MSG_FILE"
          else
            git log -1 --format=%B > "$MSG_FILE"
          fi
          pre-commit run -c .github/config/pre-commit-config.yaml --hook-stage commit-msg --commit-msg-filename "$MSG_FILE"

  backend-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.tests == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install poetry poetry-plugin-export

      - name: Install lightweight test dependencies
        run: |
          cd backend
          poetry export -f requirements.txt --only main --without-hashes -o /tmp/requirements.txt
          cd ..
          pip install -r /tmp/requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
          POSTGRES_HOST: localhost
          JWT_SECRET: ci-test-secret-key-not-for-production
          FIRST_ADMIN_EMAIL: admin@test.local
          FIRST_ADMIN_PASSWORD: testpassword123
          FRONTEND_URL: http://localhost:5173
        run: pytest tests/test_api.py tests/test_config.py -q

  shell-syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check example scripts
        run: bash -n example/*.sh

  frontend-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build

  build-and-push:
    runs-on: ubuntu-latest
    needs: [changes, backend-tests, frontend-build]
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/kost' || startsWith(github.ref, 'refs/tags/v')) &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped')

    env:
      REGISTRY: ghcr.io
      ORG: ass-nss-project

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata — Backend
        id: meta-backend
        if: needs.changes.outputs.backend == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.ORG }}/webrag-backend
          tags: |
            type=ref,event=branch,suffix=-{{sha}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}

      - name: Build and push backend image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata — frontend
        id: meta-frontend
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.ORG }}/webrag-frontend
          tags: |
            type=ref,event=branch,suffix=-{{sha}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}

      - name: Build and push frontend image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
