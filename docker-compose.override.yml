# Local development override — HTTP only, no TLS redirect, no ACME.
# Picked up automatically by `docker compose up` / `podman compose up`.
#
# Traefik still listens on 80 (and 443 from base), but there is no
# HTTP→HTTPS redirect in this profile so plain http://localhost works.
#
# For Podman rootless you need two one-time setup steps:
#   1. Allow binding port 80 (requires root):
#        echo 'net.ipv4.ip_unprivileged_port_start=80' | sudo tee -a /etc/sysctl.d/99-podman-ports.conf
#        sudo sysctl -p /etc/sysctl.d/99-podman-ports.conf
#
#   2. Enable the Podman user socket (survives reboots via systemd):
#        systemctl --user enable --now podman.socket
#      Then add to .env:
#        DOCKER_SOCK=/run/user/1000/podman/podman.sock
#      (replace 1000 with your actual UID from `id -u`)

services:
  traefik:
    # Override the full command: remove TLS redirect, ACME, and websecure entrypoint.
    # Ports 80:80 and 443:443 are kept from the base compose file.
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    volumes:
      # :z relabels the socket so SELinux allows container access.
      # Set DOCKER_SOCK in .env to your Podman socket path (see header comment).
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro,z
      # no acme.json needed without TLS

  api:
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/auth`) || PathPrefix(`/sources`) || PathPrefix(`/query`) || PathPrefix(`/incidents`) || PathPrefix(`/health`))
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8000

  frontend:
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=80
