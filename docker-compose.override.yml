# Local development override — HTTP only, no TLS redirect, no ACME.
# Picked up automatically by `docker compose up` / `podman compose up`.
#
# Traefik still listens on 80 (and 443 from base), but there is no
# HTTP→HTTPS redirect in this profile so plain http://localhost works.
#
# For Podman rootless you need two one-time setup steps:
#   1. Allow binding port 80 (requires root):
#        echo 'net.ipv4.ip_unprivileged_port_start=80' | sudo tee -a /etc/sysctl.d/99-podman-ports.conf
#        sudo sysctl -p /etc/sysctl.d/99-podman-ports.conf
#
#   2. Enable the Podman user socket (survives reboots via systemd):
#        systemctl --user enable --now podman.socket
#      Then add to .env:
#        DOCKER_SOCK=/run/user/1000/podman/podman.sock
#      (replace 1000 with your actual UID from `id -u`)

services:
  traefik:
    # Override the full command: remove TLS redirect, ACME, and websecure entrypoint.
    # Ports 80:80 and 443:443 are kept from the base compose file.
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    volumes:
      # :z relabels the socket so SELinux allows container access.
      # Set DOCKER_SOCK in .env to your Podman socket path (see header comment).
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro,z
      # Keep the file mount from base compose — without this entry the merge leaves
      # the base mount active, and if acme.json is absent Podman creates a directory.
      - ./acme.json:/acme.json

  api:
    # Wait for postgres TCP port before handing off to uvicorn.
    # Prevents the --reload loop from spamming failed migration attempts while
    # postgres is running initdb on first boot (podman-compose ignores
    # condition: service_healthy on the base depends_on).
    command: >
      sh -c "
        until python -c \"import socket; socket.create_connection(('postgres', 5432), timeout=2)\" 2>/dev/null; do
          echo 'Waiting for postgres TCP…'; sleep 2;
        done &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload --access-log
      "
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/auth`) || PathPrefix(`/sources`) || PathPrefix(`/query`) || PathPrefix(`/incidents`) || PathPrefix(`/documents`) || PathPrefix(`/experiments`) || PathPrefix(`/health`) || PathPrefix(`/metrics`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`))
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8000
      # Disable the HTTPS router defined in the base compose (no websecure entrypoint in dev)
      - traefik.http.routers.api-secure.entrypoints=web
      - traefik.http.routers.api-secure.tls=false

  rabbitmq:
    # Podman rootless UID-mapping fix: the RabbitMQ entrypoint writes
    # .erlang.cookie as container-root (→ host user), but rabbitmq-server
    # reads it as UID 999. chmod 640 makes it group-readable so UID 999 can
    # open it without needing chown (which requires CAP_CHOWN, not available
    # in rootless).
    entrypoint:
      - sh
      - -c
      - |
        COOKIE=/var/lib/rabbitmq/.erlang.cookie
        rm -f "$$COOKIE" 2>/dev/null || true
        if [ -n "$$RABBITMQ_ERLANG_COOKIE" ] && [ ! -f "$$COOKIE" ]; then
          echo "$$RABBITMQ_ERLANG_COOKIE" > "$$COOKIE"
          chmod 400 "$$COOKIE"
        fi
        exec docker-entrypoint.sh rabbitmq-server

  worker:
    command: >
      sh -c "
        until python -c \"import socket; socket.create_connection(('postgres', 5432), timeout=2)\" 2>/dev/null; do
          echo 'Waiting for postgres TCP…'; sleep 2;
        done &&
        python worker.py
      "

  frontend:
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=80
      # Disable the HTTPS router defined in the base compose (no websecure entrypoint in dev)
      - traefik.http.routers.frontend-secure.entrypoints=web
      - traefik.http.routers.frontend-secure.tls=false
