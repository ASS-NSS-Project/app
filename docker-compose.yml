# Local development only.
# Production runs on Kubernetes (see infra/).
#
# Podman one-time setup (rootless):
#   Allow binding port 80 (requires root, once per machine):
#     ```
#     echo 'net.ipv4.ip_unprivileged_port_start=80' | sudo tee -a /etc/sysctl.d/99-podman-ports.conf
#     sudo sysctl -p /etc/sysctl.d/99-podman-ports.conf
#     ```
#   Enable user socket:
#     ```
#     systemctl --user enable --now podman.socket
#     ```

services:
  minio:
    image: minio/minio:latest
    container_name: rag_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API endpoint: http://localhost:9000
      - "9001:9001"   # MinIO console: http://localhost:9001
    volumes:
      - minio_data:/data
    networks:
      - ragnet

  minio_init:
    image: minio/mc:latest
    container_name: rag_minio_init
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do echo 'Waiting for MinIO...'; sleep 2; done &&
        mc mb -p local/${S3_BUCKET_EVIDENCE:-rag-evidence-dev} || true &&
        mc mb -p local/${S3_BUCKET_DOCS:-rag-documents-dev} || true
      "
    networks:
      - ragnet

  postgres:
    image: postgres:16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ragnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-raguser} -d $${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rag_rabbitmq
    restart: unless-stopped
    security_opt:
      - label=disable   # Podman rootless: allow volume chown for erlang cookie (SELinux); Docker ignores this
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-changeme_erlang_cookie}
    # Podman rootless: pre-write erlang cookie as UID 999 (rabbitmq user) so it can be read.
    # On Docker / root Podman this is a no-op — the cookie already has the right owner.
    entrypoint:
      - sh
      - -c
      - |
        COOKIE=/var/lib/rabbitmq/.erlang.cookie
        rm -f "$$COOKIE" 2>/dev/null || true
        if [ -n "$$RABBITMQ_ERLANG_COOKIE" ]; then
          echo "$$RABBITMQ_ERLANG_COOKIE" > "$$COOKIE"
          chmod 400 "$$COOKIE"
        fi
        exec docker-entrypoint.sh rabbitmq-server
    ports:
      - "15672:15672"   # Management UI: http://localhost:15672
    networks:
      - ragnet
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # Dashboard: http://localhost:6333/dashboard
    networks:
      - ragnet

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_api
    restart: unless-stopped
    environment:
      # Must provide!
      - POSTGRES_USER=${POSTGRES_USER:-raguser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-ragdb}
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-rabbit}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_PATH_STYLE=${S3_USE_PATH_STYLE:-true}
      - S3_BUCKET_EVIDENCE=${S3_BUCKET_EVIDENCE:-rag-evidence-dev}
      - S3_BUCKET_DOCS=${S3_BUCKET_DOCS:-rag-documents-dev}
      - QUERY_BASE_URL=${QUERY_BASE_URL}
      - QUERY_API_KEY=${QUERY_API_KEY}
      - QUERY_MODEL=${QUERY_MODEL}
      - VLM_BASE_URL=${VLM_BASE_URL}
      - VLM_API_KEY=${VLM_API_KEY}
      - VLM_MODEL=${VLM_MODEL}

      - FIRST_ADMIN_USERNAME=${FIRST_ADMIN_USERNAME:-admin}
      - FIRST_ADMIN_EMAIL=${FIRST_ADMIN_EMAIL:-admin@example.com}
      - FIRST_ADMIN_PASSWORD=${FIRST_ADMIN_PASSWORD}

      - JWT_SECRET=${JWT_SECRET}
      - API_DOCS=${API_DOCS:-false}

      - SERVICE_NAME=api

      # Optional: Keycloak OIDC (leave empty to disable SSO in local dev)
      - KEYCLOAK_URL=${KEYCLOAK_URL:-}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - KEYCLOAK_REDIRECT_URI=${KEYCLOAK_REDIRECT_URI:-http://localhost:8080/auth/keycloak/callback}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully
    # TCP wait loop: podman-compose ignores condition: service_healthy on depends_on,
    # so we poll the Postgres TCP port directly before starting uvicorn.
    command: >
      sh -c "
        until python -c \"import socket; socket.create_connection(('postgres', 5432), timeout=2)\" 2>/dev/null; do
          echo 'Waiting for postgres TCP…'; sleep 2;
        done &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload --access-log
      "
    ports:
      - "8000:8000"   # API direct access (optional, frontend also proxies via nginx)
    volumes:
      - ./backend:/app:z
      - api:/root/.cache/huggingface
    networks:
      - ragnet

  worker_ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_worker_ingest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-raguser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-ragdb}
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-rabbit}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_PATH_STYLE=${S3_USE_PATH_STYLE:-true}
      - S3_BUCKET_EVIDENCE=${S3_BUCKET_EVIDENCE:-rag-evidence-dev}
      - S3_BUCKET_DOCS=${S3_BUCKET_DOCS:-rag-documents-dev}
      - S3_BUCKET_EMBEDDINGS=${S3_BUCKET_EMBEDDINGS:-rag-embeddings}
      - QUERY_BASE_URL=${QUERY_BASE_URL}
      - QUERY_API_KEY=${QUERY_API_KEY}
      - QUERY_MODEL=${QUERY_MODEL}
      - VLM_BASE_URL=${VLM_BASE_URL}
      - VLM_API_KEY=${VLM_API_KEY}
      - VLM_MODEL=${VLM_MODEL}
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_NAME=worker_ingest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully
    command: >
      sh -c "
        until python -c \"import socket; socket.create_connection(('postgres', 5432), timeout=2)\" 2>/dev/null; do
          echo 'Waiting for postgres TCP…'; sleep 2;
        done &&
        python worker_ingest.py
      "
    volumes:
      - ./backend:/app:z
      - worker_ingest:/root/.cache/huggingface
    networks:
      - ragnet

  worker_embed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_worker_embed
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-raguser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-ragdb}
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:-rabbit}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_PATH_STYLE=${S3_USE_PATH_STYLE:-true}
      - S3_BUCKET_DOCS=${S3_BUCKET_DOCS:-rag-documents-dev}
      - S3_BUCKET_EMBEDDINGS=${S3_BUCKET_EMBEDDINGS:-rag-embeddings}
      - ENABLE_EMBEDDING_BACKUP_S3=${ENABLE_EMBEDDING_BACKUP_S3:-false}
      - EMBEDDING_WORKER_METRICS_PORT=9091
      - SERVICE_NAME=worker_embed
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully
    command: >
      sh -c "
        until python -c \"import socket; socket.create_connection(('postgres', 5432), timeout=2)\" 2>/dev/null; do
          echo 'Waiting for postgres TCP…'; sleep 2;
        done &&
        python worker_embed.py
      "
    volumes:
      - ./backend:/app:z
      - worker_embed:/root/.cache/huggingface
    networks:
      - ragnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    depends_on:
      - api
    ports:
      - "8080:80"   # UI: http://localhost:8080  (nginx also proxies /auth, /sources, etc. to the api)
    networks:
      - ragnet

volumes:
  minio_data:
  postgres_data:
  rabbitmq_data:  # Persists erlang cookie and queued messages across restarts
  qdrant_data:
  api:            # BGE-M3 weights for API (~570 MB, downloaded once)
  worker_ingest:  # BGE-M3 weights for ingest worker (~570 MB, downloaded once)
  worker_embed:   # BGE-M3 weights for embedding worker (~570 MB, downloaded once)

networks:
  ragnet:
    driver: bridge
