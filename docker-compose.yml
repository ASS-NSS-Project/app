services:
  postgres:
    image: postgres:16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ragnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rag_rabbitmq
    security_opt:
      - label=disable   # Podman rootless: allow volume chown for erlang cookie (SELinux)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-changeme_erlang_cookie}
    ports:
      - "127.0.0.1:15672:15672"   # Management UI: http://localhost:15672
    networks:
      - ragnet
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    networks:
      - ragnet
    # No healthcheck – the endpoint changed between versions.
    # The API connects lazily and retries on first use.

  traefik:
    image: traefik:v3
    container_name: rag_traefik
    restart: unless-stopped
    security_opt:
      - label=disable   # Podman rootless: allow access to container socket (SELinux)
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      # Let's Encrypt via HTTP-01 — activates automatically once DOMAIN points to this server
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/acme.json
    networks:
      - ragnet

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_api
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_PATH_STYLE=${S3_USE_PATH_STYLE:-true}
      - S3_BUCKET_EVIDENCE=${S3_BUCKET_EVIDENCE:-rag-evidence}
      - S3_BUCKET_DOCS=${S3_BUCKET_DOCS:-rag-documents}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - VLM_BASE_URL=${VLM_BASE_URL}
      - VLM_API_KEY=${VLM_API_KEY}
      - VLM_MODEL=${VLM_MODEL}
      - JWT_SECRET=${JWT_SECRET}
      - FIRST_ADMIN_EMAIL=${FIRST_ADMIN_EMAIL}
      - FIRST_ADMIN_PASSWORD=${FIRST_ADMIN_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app:z
      - hf_cache:/root/.cache/huggingface
    networks:
      - ragnet
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --access-log
    labels:
      - traefik.enable=true
      # HTTP
      - traefik.http.routers.api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/auth`) || PathPrefix(`/sources`) || PathPrefix(`/query`) || PathPrefix(`/incidents`) || PathPrefix(`/health`))
      - traefik.http.routers.api.entrypoints=web
      # HTTPS (cert obtained automatically once DOMAIN resolves to this server)
      - traefik.http.routers.api-secure.rule=Host(`${DOMAIN}`) && (PathPrefix(`/auth`) || PathPrefix(`/sources`) || PathPrefix(`/query`) || PathPrefix(`/incidents`) || PathPrefix(`/health`))
      - traefik.http.routers.api-secure.entrypoints=websecure
      - traefik.http.routers.api-secure.tls=true
      - traefik.http.routers.api-secure.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=8000

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_worker
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_PATH_STYLE=${S3_USE_PATH_STYLE:-true}
      - S3_BUCKET_EVIDENCE=${S3_BUCKET_EVIDENCE:-rag-evidence}
      - S3_BUCKET_DOCS=${S3_BUCKET_DOCS:-rag-documents}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - VLM_BASE_URL=${VLM_BASE_URL}
      - VLM_API_KEY=${VLM_API_KEY}
      - VLM_MODEL=${VLM_MODEL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app:z
      - hf_cache:/root/.cache/huggingface
    networks:
      - ragnet
    command: python worker.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    depends_on:
      - api
    networks:
      - ragnet
    labels:
      - traefik.enable=true
      # HTTP
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=web
      # HTTPS (cert obtained automatically once DOMAIN resolves to this server)
      - traefik.http.routers.frontend-secure.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend-secure.entrypoints=websecure
      - traefik.http.routers.frontend-secure.tls=true
      - traefik.http.routers.frontend-secure.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - traefik.http.routers.frontend-secure.middlewares=security-headers
      # Security headers middleware
      - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.security-headers.headers.stsPreload=true
      - traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.security-headers.headers.frameDeny=true
      - traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin

volumes:
  postgres_data:
  rabbitmq_data:    # Persists erlang cookie and queued messages across restarts
  qdrant_data:
  hf_cache:         # BGE-M3 weights shared between api and worker (~570 MB, downloaded once)

networks:
  ragnet:
    driver: bridge
