server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA fallback — all paths serve the Vue app (API routing handled by Traefik)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts all content-hashed assets in /assets/ — safe to cache immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static files (favicon, etc.) — revalidate so deploys take effect.
    location ~* \.(png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }
}
