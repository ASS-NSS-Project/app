server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API reverse proxy — mirrors vite.config.ts in local dev.
    # In production (K8s) Traefik routes these paths directly to the API service
    # so nginx never receives them; these blocks are harmless there.
    location ~* ^/(auth|sources|query|incidents|documents|experiments|health|metrics|docs|redoc|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    # SPA fallback — all other paths serve the Vue app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts all content-hashed assets in /assets/ — safe to cache immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Other static files (favicon, etc.) — revalidate so deploys take effect.
    location ~* \.(png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }
}
