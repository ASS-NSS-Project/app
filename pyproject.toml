[tool.poetry]
name = "repo"
description = ""
authors = ["Name"]
readme = "README.md"

version = "0.1.0"
packages = [
    { include = "backend" },
    { include = "example_raglib", from = "src" },
]

[tool.poetry.scripts]
frontend = "scripts.run:frontend"
backend = "scripts.run:backend"
tests = "scripts.run:tests"

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
fastapi = "^0.135.2"
spacy = "^3.8.13"
scikit-learn = "^1.8.0"
sqlalchemy = "^2.0.48"
pydantic = "^2.12.5"
uvicorn = "^0.42.0"
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"
conventional-pre-commit = "^4.4.0"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
